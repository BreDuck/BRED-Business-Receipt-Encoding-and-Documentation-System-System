<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset your BRED password</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFF9E8;font-family:Arial,Helvetica,sans-serif;color:#202124}
  main{width:100%;max-width:420px;margin:16px;padding:28px;background:#FFFDF5;border:1px solid #EFE2B7;border-radius:16px;border-top:4px solid #F7A72E}
  h1{margin:0 0 6px;font-size:22px} p{line-height:1.5;color:#505660}
  label{display:block;margin:14px 0 4px;font-size:13px;font-weight:700}
  input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #D9CFA8;border-radius:8px;font-size:15px}
  button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#F7A72E;color:#202124;font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #msg{margin-top:14px;font-size:14px;min-height:20px} .err{color:#B3261E} .ok{color:#1B6E2D}
</style>
</head>
<body>
<main>
  <h1>Reset your password</h1>
  <p>Choose a new password for your BRED account.</p>
  <form id="form" hidden>
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="save" type="submit">Save new password</button>
  </form>
  <form id="start" hidden>
    <button id="verify" type="submit">Continue</button>
  </form>
  <div id="msg" role="status"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // Set these two values once (the anon key is public by design).
  const SUPABASE_URL = "https://psslayjtlaicykumouoz.supabase.co";
  const SUPABASE_ANON_KEY = "PASTE-YOUR-SUPABASE-ANON-KEY-HERE";

  const msg = document.getElementById("msg");
  const show = (t, cls) => { msg.textContent = t; msg.className = cls || ""; };
  const params = new URLSearchParams(location.search);
  const tokenHash = params.get("token_hash");
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });

  if (!tokenHash || params.get("type") !== "recovery") {
    show("This reset link is incomplete. Ask your Creator to send a new one.", "err");
  } else {
    document.getElementById("start").hidden = false;
  }

  // The token is only used when the person clicks, so mail link scanners can't burn it.
  document.getElementById("start").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("verify").disabled = true;
    const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
    if (error) { show("This link has expired or was already used. Ask your Creator for a new one.", "err"); return; }
    history.replaceState(null, "", location.pathname);
    document.getElementById("start").hidden = true;
    document.getElementById("form").hidden = false;
    show("");
  });

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const a = document.getElementById("pw").value, b = document.getElementById("pw2").value;
    if (a !== b) { show("The passwords don't match.", "err"); return; }
    if (a.length < 8) { show("Use at least 8 characters.", "err"); return; }
    document.getElementById("save").disabled = true;
    const { error } = await client.auth.updateUser({ password: a });
    if (error) { show(error.message, "err"); document.getElementById("save").disabled = false; return; }
    await client.auth.signOut();
    document.getElementById("form").hidden = true;
    show("Password updated. You can now sign in to BRED with your new password.", "ok");
  });
</script>
</body>
</html>
